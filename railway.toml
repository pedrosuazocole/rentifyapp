[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm run build && npx prisma migrate deploy && node -e \"const{PrismaClient}=require('@prisma/client');const bcrypt=require('bcryptjs');const p=new PrismaClient();bcrypt.hash('Admin1234!',12).then(h=>p.user.upsert({where:{email:'admin@rentify.hn'},update:{},create:{email:'admin@rentify.hn',passwordHash:h,name:'Administrador Rentify',phone:'+50498765432',role:'ADMIN',baseCurrency:'HNL',printPreview:true,isActive:true}})).then(()=>p.\$disconnect())\" && npm run start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
